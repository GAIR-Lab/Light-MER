model:
  arch: affectgpt
  model_type: pretrain_vicuna

  # These flags define the public Stage 2 M-GRPO training setup.
  frozen_video_proj: False
  frozen_video_Qformer: False
  frozen_audio_Qformer: False
  frozen_audio_proj: False
  frozen_multi_Qformer: False
  frozen_multi_llama_proj: False
  frozen_llm: False
  lora_r: 16

  multi_fusion_type: attention
  video_fusion_type: attention
  audio_fusion_type: attention
  image_fusion_type: mean

  ckpt: ""
  ckpt_2: ""

  llama_model: Qwen3_0.6B
  acoustic_encoder: HUBERT_BASE
  visual_encoder: CLIP_VIT_BASE

  num_audio_query_token: 1
  num_video_query_token: 1
  num_multi_query_token: 1
  num_image_query_token: 1
  max_length: 1024

  vis_processor:
    train:
      name: alpro_video_train
      n_frms: 8
      image_size: 224
  text_processor:
    train:
      name: blip_caption
  img_processor:
    train:
      name: blip2_image_train
      image_size: 224

  grpo:
    ckpt: checkpoints/stage1-swdh-qwen3-0.6b/checkpoint_000025_loss_1.549.pth
    num_completions: 4
    max_new_tokens: 120
    gen_temperature: 0.9
    gen_top_p: 0.90
    clip_eps: 0.10
    kl_coef: 1.0
    lr: 1e-7
    num_epochs: 3
    max_steps: 5000
    grad_accum: 4
    w_format: 1.0
    w_brevity: 0.3
    w_no_reason: 0.5
    w_clean_stop: 0.3
    w_emotion: 2.0
    log_generated_text: False
    log_interval: 5
    save_interval: 500
    save_steps: [50]

datasets:
  mercaptionplus:
    data_type: video
    face_or_frame: multiface_audio_face_text
    label_type: ovlabel

run:
  task: video_text_pretrain
  lr_sched: linear_warmup_cosine_lr
  init_lr: 1e-5
  min_lr: 1e-6
  warmup_lr: 1e-7
  weight_decay: 0.01
  max_epoch: 3
  iters_per_epoch: 5000
  warmup_steps: 100
  batch_size_train: 1
  batch_size_eval: 1
  accum_grad_iters: 1
  seed: 42
  num_workers: 4
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: [train]
  device: cuda
  world_size: 1
  dist_url: env://
  distributed: False
  output_dir: output/stage2_mgrpo_qwen3_0_6b

inference:
  task: video_text_pretrain
  vis_processor:
    train:
      name: alpro_video_eval
      n_frms: 8
      image_size: 224
  text_processor:
    train:
      name: blip_caption
  img_processor:
    train:
      name: blip2_image_eval
      image_size: 224
  face_or_frame: null
  base_root: output_stage2_mgrpo/results
  ckpt_root: null
  ckpt_name: null
  test_epoch: null
  test_epochs: null
  skip_epoch: 1
  gpu: 0
